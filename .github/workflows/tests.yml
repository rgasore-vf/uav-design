name: tests

on:
  push:
  pull_request:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests de cohérence
        run: python -m unittest discover -s tests -v
      - name: Sorties à jour
        run: |
          python calc/model.py > /dev/null
          git diff --exit-code calc/out || (echo "calc/out n'est pas à jour : lancer make calc" && exit 1)
